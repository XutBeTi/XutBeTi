name: Generate Pacman

on:
  schedule:
    - cron: "0 0 * * *" # chạy tự động mỗi ngày 0h UTC
  workflow_dispatch: # có thể chạy thủ công từ tab Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Generate Pac-Man SVG (nhiều ma + tốc độ nhanh hơn)
      - uses: platane/snk@v3
        with:
          github_user_name: XutBeTi
          theme_name: "pacman"
          color_snake: "#00FF00" # màu đường đi của Pac-Man
          color_dots: "#FFD700"  # màu hạt (dot)
          color_ghosts: "#FF69B4,#00FFFF,#FF0000,#FFA500,#9400D3" # thêm 5 con ma đủ màu
          speed: 2.5 # tốc độ Pac-Man nhanh hơn
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg

      # 3️⃣ Push kết quả ra branch output
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
