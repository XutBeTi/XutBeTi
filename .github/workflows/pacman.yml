name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"  # chạy mỗi ngày 1 lần
  workflow_dispatch:      # cho phép chạy thủ công
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate pacman-contribution-graph.svg with ghosts
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          # ✅ Các tùy chỉnh thêm:
          pacman_color: "#FFEB3B"       # màu vàng Pac-Man
          background_color: "#0D1117"   # nền tối
          dots_color: "#FFFFFF"         # chấm trắng
          ghosts: "true"                # bật các con ma
          ghost_colors: "red,cyan,pink,orange"  # màu 4 con ma
          speed: "2"                    # tốc độ ăn chấm (1 chậm – 5 nhanh)
          grid_color: "#2f363d"         # màu khung nền
          show_grid: "false"            # tắt lưới nếu muốn mịn hơn

      - name: Push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
